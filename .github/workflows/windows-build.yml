name: Windows Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  windows-build-qt6:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      KDECI_BUILD_TYPE: Release
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-windows
      KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: 'False'
      KDECI_EXTRA_CMAKE_ARGS: >-
        -DHIDE_SAFE_ASSERTS=OFF
        -DBUILD_TESTING=OFF
        -DBUILD_WITH_QT6=ON
        -DALLOW_UNSTABLE=QT6
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
      KRITACI_SKIP_DEBUG_PACKAGE: 'True'
      KRITACI_BUILD_INSTALLERS: 'False'
      KRITACI_SKIP_UPLOAD_NIGHTLY_PACKAGE: 'True'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout Krita
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install MSYS2 CLANG64 toolchain
        shell: pwsh
        run: |
          # Install non-compiler tools from current repo
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed `
            mingw-w64-clang-x86_64-toolchain `
            mingw-w64-clang-x86_64-cmake `
            mingw-w64-clang-x86_64-ninja `
            mingw-w64-clang-x86_64-ccache

      - name: Fix PATH for build
        shell: pwsh
        run: |
          # Remove any other mingw/llvm from PATH, prepend CLANG64 and _install\bin.
          $cleanPath = ($env:Path -split ';' | Where-Object {
            $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry' -and $_ -notmatch 'LLVM'
          }) -join ';'
          $installBin = "${{ github.workspace }}\_install\bin"
          $clang64Bin = "C:\msys64\clang64\bin"
          echo "Path=$installBin;$clang64Bin;$cleanPath" >> $env:GITHUB_ENV

      - name: Clone build utilities
        shell: pwsh
        run: |
          git clone https://invent.kde.org/packaging/krita-deps-management.git -b transition.now/qt6 --depth=1
          git clone https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities --depth=1

      - name: Install Python dependencies
        shell: pwsh
        run: pip install -r krita-deps-management/requirements.txt

      - name: Cache downloaded packages
        uses: actions/cache@v4
        with:
          path: _cache
          key: krita-deps-${{ runner.os }}-${{ hashFiles('krita-deps-management/latest/krita-deps.yml') }}
          restore-keys: krita-deps-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: _ccache
          key: krita-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: krita-ccache-${{ runner.os }}-

      - name: Prepare dependency specification
        shell: pwsh
        run: |
          python -u krita-deps-management/tools/replace-branch-in-seed-file.py `
            krita-deps-management/latest/krita-deps.yml `
            -p -o branch-corrected-deps.yml `
            -d transition.now/qt6
          python -u krita-deps-management/tools/generate-deps-file.py `
            -s branch-corrected-deps.yml `
            -o .kde-ci.yml

      - name: Fetch dependencies
        shell: pwsh
        env:
          KDECI_CACHE_PATH: ${{ github.workspace }}\_cache
          KDECI_CC_CACHE: ${{ github.workspace }}\_ccache
          KDECI_REPO_METADATA_PATH: ${{ github.workspace }}\krita-deps-management\repo-metadata
        run: |
          git config --global --add safe.directory $env:GITHUB_WORKSPACE
          python -u krita-deps-management/ci-utilities/run-ci-build.py `
            --project krita `
            --branch $env:GITHUB_REF_NAME `
            --platform Windows/Qt6/Shared `
            --skip-publishing `
            --only-deps `
            2>&1 | Tee-Object -FilePath fetch-deps.log

      - name: Patch boost 1.80 for clang 22 enum-constexpr issue
        shell: pwsh
        run: |
          $header = "${{ github.workspace }}\_install\include\boost-1_80\boost\mpl\aux_\integral_wrapper.hpp"
          if (-not (Test-Path $header)) { throw "Header not found: $header" }
          # The installed header has a KDE modification that activates the
          # `#if BOOST_WORKAROUND(__EDG_VERSION__, <= 243) || __cplusplus >= 201103L` branch
          # for all C++11+ compilers (including clang). That branch declares
          #   BOOST_STATIC_CONSTANT(AUX_WRAPPER_VALUE_TYPE, prior_value = ... (N - 1));
          # which clang 22 rejects for enum types at their lower bound because
          # enum(-1) is outside the enum's representable range — a non-constant
          # expression per C++17.
          #
          # Replace the branch body with type-dispatched typedefs: use self-type
          # for enum types (avoiding the out-of-range instantiation), keep the
          # arithmetic for integer types (so mpl::prior/mpl::next still work in
          # boost::accumulators, boost::fusion, etc.).
          $lines = Get-Content $header
          Write-Host "=== Lines 55-80 BEFORE patch ==="
          for ($j = 54; $j -lt [Math]::Min(80, $lines.Count); $j++) {
            Write-Host ("{0,3}: {1}" -f ($j+1), $lines[$j])
          }

          # Find the `private:` line after the `#if BOOST_WORKAROUND(__EDG_VERSION__`
          $startIdx = -1
          $endIdx = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\s*private\s*:\s*$' -and $startIdx -eq -1) {
              # Check the preceding line is the #if with __EDG_VERSION__
              if ($i -ge 1 -and ($lines[$i-1] -match '__EDG_VERSION__|__cplusplus')) {
                $startIdx = $i
                # Find the matching #elif/#else/#endif
                for ($k = $i + 1; $k -lt $lines.Count; $k++) {
                  if ($lines[$k] -match '^\s*(#elif|#else|#endif)') { $endIdx = $k - 1; break }
                }
                break
              }
            }
          }
          if ($startIdx -lt 0 -or $endIdx -lt 0) { throw "Could not locate target block" }
          Write-Host "Replacing lines $($startIdx+1)..$($endIdx+1)"

          # Build the replacement using std::conditional + lazy instantiation.
          # Class-scope partial specialization is not standard C++, so we use
          # two class templates and pick via std::conditional. Only the selected
          # template gets its body instantiated, so the enum-out-of-range
          # instantiation of integral_c<enum, -1> is never triggered.
          $replacement = @(
            ' private:',
            '    // patched for clang 22 enum-constexpr: type-dispatched next/prior',
            '    template<class __U> struct __np_self_ {',
            '        typedef AUX_WRAPPER_NAME next;',
            '        typedef AUX_WRAPPER_NAME prior;',
            '    };',
            '    template<class __U> struct __np_arith_ {',
            '        typedef AUX_WRAPPER_INST( BOOST_MPL_AUX_STATIC_CAST(__U, (N + 1)) ) next;',
            '        typedef AUX_WRAPPER_INST( BOOST_MPL_AUX_STATIC_CAST(__U, (N - 1)) ) prior;',
            '    };',
            '    typedef typename ::std::conditional<',
            '        ::std::is_enum<AUX_WRAPPER_VALUE_TYPE>::value,',
            '        __np_self_<AUX_WRAPPER_VALUE_TYPE>,',
            '        __np_arith_<AUX_WRAPPER_VALUE_TYPE>',
            '    >::type __np_chosen_;',
            ' public:',
            '    typedef typename __np_chosen_::next next;',
            '    typedef typename __np_chosen_::prior prior;'
          )

          $before = $lines[0..($startIdx-1)]
          $after = $lines[($endIdx+1)..($lines.Count-1)]
          $newLines = @() + $before + $replacement + $after

          # Ensure <type_traits> is included (for std::is_enum)
          $hasTypeTraits = $false
          foreach ($line in $newLines) {
            if ($line -match '#include\s+<type_traits>') { $hasTypeTraits = $true; break }
          }
          if (-not $hasTypeTraits) {
            # Insert after the last existing #include
            $lastInclude = -1
            for ($i = 0; $i -lt $newLines.Count; $i++) {
              if ($newLines[$i] -match '^#include') { $lastInclude = $i }
              if ($newLines[$i] -match 'BOOST_MPL_AUX_ADL_BARRIER_NAMESPACE_OPEN') { break }
            }
            if ($lastInclude -ge 0) {
              $newLines = @() + $newLines[0..$lastInclude] + '#include <type_traits>' + $newLines[($lastInclude+1)..($newLines.Count-1)]
            }
          }

          $newLines | Set-Content $header
          Write-Host "=== Lines 55-95 AFTER patch ==="
          $after_lines = Get-Content $header
          for ($j = 54; $j -lt [Math]::Min(95, $after_lines.Count); $j++) {
            Write-Host ("{0,3}: {1}" -f ($j+1), $after_lines[$j])
          }

      - name: Build and install Krita
        shell: pwsh
        env:
          KDECI_CACHE_PATH: ${{ github.workspace }}\_cache
          KDECI_CC_CACHE: ${{ github.workspace }}\_ccache
          KDECI_REPO_METADATA_PATH: ${{ github.workspace }}\krita-deps-management\repo-metadata
        run: |
          python -u krita-deps-management/ci-utilities/run-ci-build.py `
            --project krita `
            --branch $env:GITHUB_REF_NAME `
            --platform Windows/Qt6/Shared `
            --skip-publishing `
            --only-build `
            --skip-dependencies-fetch `
            2>&1 | Tee-Object -FilePath build-krita.log

      - name: Diagnose qtpaths on failure
        if: failure()
        shell: pwsh
        run: |
          $qtpaths = "${{ github.workspace }}\_install\bin\qtpaths.exe"
          Write-Host "=== PATH ==="
          $env:Path -split ';' | ForEach-Object { Write-Host $_ }
          Write-Host "=== clang version ==="
          & clang --version
          if (Test-Path $qtpaths) {
            Write-Host "=== qtpaths deps ==="
            & "C:\msys64\clang64\bin\ldd.exe" $qtpaths 2>&1 | Out-Host
            Write-Host "=== direct qtpaths invocation ==="
            $ErrorActionPreference = 'Continue'
            & $qtpaths --query QT_INSTALL_PREFIX 2>&1 | Out-Host
            Write-Host "ExitCode: $LASTEXITCODE"
          } else {
            Write-Host "qtpaths.exe not found at $qtpaths"
          }

      - name: Patch packaging script for MSYS2 CLANG64 runtime libs
        shell: pwsh
        run: |
          # MSYS2 CLANG64 ships OpenSSL 3.x, not 1.1. The packaging script
          # hardcodes OpenSSL 1.1 DLL names. Make all runtime lib copies
          # conditional so missing libs are skipped instead of failing.
          $script = Get-Content -Path "packaging\windows\package-complete.py" -Raw
          $script = $script.Replace(
            "if lib != 'libssp-0' or os.path.isfile(libPath):",
            "if os.path.isfile(libPath):"
          )
          Set-Content -Path "packaging\windows\package-complete.py" -Value $script -NoNewline

      - name: Package Krita
        shell: pwsh
        env:
          CI_COMMIT_SHORT_SHA: ${{ github.sha }}
        run: |
          python -u build-tools/ci-scripts/build-windows-package.py `
            2>&1 | Tee-Object -FilePath build-package.log

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: krita-windows
          path: |
            krita-*.zip
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            *.log
            _build/CMakeFiles/CMakeConfigureLog.yaml
            _build/CMakeCache.txt
          retention-days: 3
